    <circle cx="90" cy="38" r="11" fill="#FFF1A8" stroke="#FFD34E" stroke-width="3"/>
    <path d="M16 74 Q40 66 64 72 T112 70 V90 H16 Z" fill="#1A55B0"/>
    <path d="M30 76 Q50 54 76 62 Q86 66 92 76 Z" fill="#4CC36E" stroke="#1B1207" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M40 72 Q56 60 70 66" fill="none" stroke="#9BEA9F" stroke-width="2.5" stroke-linecap="round"/>
    <!-- palm -->
    <path d="M58 64 Q60 50 56 40" fill="none" stroke="#7B4A22" stroke-width="4" stroke-linecap="round"/>
    <path d="M56 40 Q46 36 40 42 M56 40 Q66 34 72 40 M56 40 Q50 30 42 32 M56 40 Q62 30 70 30" fill="none" stroke="#2E9E52" stroke-width="4" stroke-linecap="round"/>
