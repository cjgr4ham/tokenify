  </g>
  <rect x="16" y="18" width="96" height="72" rx="8" fill="none" stroke="#1B1207" stroke-width="2.5"/>
  <!-- loading bar -->
  <rect x="26" y="100" width="76" height="12" rx="6" fill="#0D1B33" stroke="#1B1207" stroke-width="3.5"/>
  <rect x="29" y="103" width="46" height="6" rx="3" fill="#56AEFC"/>
