<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Loading Screen">
  <defs>
    <linearGradient id="ls-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FDBFF"/><stop offset=".7" stop-color="#3B9BF0"/><stop offset="1" stop-color="#1E62C9"/></linearGradient>
    <linearGradient id="ls-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A3"/><stop offset=".5" stop-color="#F0BA43"/><stop offset="1" stop-color="#B3700C"/></linearGradient>
    <clipPath id="ls-clip"><rect x="16" y="18" width="96" height="72" rx="8"/></clipPath>
  </defs>
  <ellipse cx="64" cy="118" rx="44" ry="6" fill="#000" opacity=".35"/>
  <!-- tilted backing card -->
  <rect x="22" y="12" width="96" height="72" rx="9" fill="#14305E" stroke="#1B1207" stroke-width="4" transform="rotate(6 70 48)"/>
  <!-- frame -->
  <rect x="12" y="14" width="104" height="80" rx="11" fill="url(#ls-gold)" stroke="#1B1207" stroke-width="4.5"/>
