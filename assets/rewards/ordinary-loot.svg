<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Ordinary Loot">
  <defs>
    <linearGradient id="ol-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0B3"/><stop offset="1" stop-color="#F0B845"/></linearGradient>
    <linearGradient id="ol-side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D99A2B"/><stop offset="1" stop-color="#8F5809"/></linearGradient>
    <radialGradient id="ol-face" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#FFF4C4"/><stop offset=".6" stop-color="#F4C04D"/><stop offset="1" stop-color="#C47F15"/></radialGradient>
  </defs>
  <ellipse cx="64" cy="110" rx="50" ry="8" fill="#000" opacity=".35"/>
  <!-- flat coin, back left -->
  <ellipse cx="34" cy="100" rx="22" ry="8" fill="url(#ol-side)" stroke="#1B1207" stroke-width="3.5"/>
  <ellipse cx="34" cy="96" rx="22" ry="8" fill="url(#ol-top)" stroke="#1B1207" stroke-width="3.5"/>
  <ellipse cx="34" cy="96" rx="14" ry="4.6" fill="none" stroke="#C98A1E" stroke-width="2"/>
  <!-- coin stack, right -->
  <g stroke="#1B1207" stroke-width="3.5" stroke-linejoin="round">
    <path d="M62 98 A24 8.5 0 0 0 110 98 V104 A24 8.5 0 0 1 62 104 Z" fill="url(#ol-side)"/>
    <ellipse cx="86" cy="98" rx="24" ry="8.5" fill="url(#ol-top)"/>
    <path d="M62 86 A24 8.5 0 0 0 110 86 V92 A24 8.5 0 0 1 62 92 Z" fill="url(#ol-side)"/>
    <ellipse cx="86" cy="86" rx="24" ry="8.5" fill="url(#ol-top)"/>
    <path d="M64 74 A24 8.5 0 0 0 112 74 V80 A24 8.5 0 0 1 64 80 Z" fill="url(#ol-side)"/>
    <ellipse cx="88" cy="74" rx="24" ry="8.5" fill="url(#ol-top)"/>
    <path d="M61 62 A24 8.5 0 0 0 109 62 V68 A24 8.5 0 0 1 61 68 Z" fill="url(#ol-side)"/>
    <ellipse cx="85" cy="62" rx="24" ry="8.5" fill="url(#ol-top)"/>
  </g>
  <ellipse cx="85" cy="62" rx="15" ry="5" fill="none" stroke="#C98A1E" stroke-width="2"/>
  <!-- standing coin, front -->
  <circle cx="46" cy="70" r="24" fill="#8F5809" stroke="#1B1207" stroke-width="4"/>
  <circle cx="43" cy="70" r="23" fill="url(#ol-face)" stroke="#1B1207" stroke-width="3.5"/>
  <circle cx="43" cy="70" r="16" fill="none" stroke="#C98A1E" stroke-width="2.4"/>
  <!-- skull emblem -->
  <g transform="translate(43 69)" fill="#B9760F">
    <path d="M-8 -2 A8 8 0 0 1 8 -2 L8 3 L4 4 L4 8 L-4 8 L-4 4 L-8 3 Z"/>
    <circle cx="-3.2" cy="-1" r="2.2" fill="#FFE9A3"/><circle cx="3.2" cy="-1" r="2.2" fill="#FFE9A3"/>
  </g>
  <path d="M28 58 A18 18 0 0 1 40 50" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".75"/>
  <!-- glint -->
  <g fill="#FFF6CC" stroke="#1B1207" stroke-width="1.5" stroke-linejoin="round"><path d="M100 30l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g>
</svg>
