<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Pickaxe or Back Bling">
  <defs>
    <linearGradient id="pb-leather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B07A44"/><stop offset="1" stop-color="#6A3E1A"/></linearGradient>
    <linearGradient id="pb-crystal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0E2FF"/><stop offset=".45" stop-color="#B57CFF"/><stop offset="1" stop-color="#5B23B8"/></linearGradient>
    <linearGradient id="pb-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A3"/><stop offset=".5" stop-color="#F0BA43"/><stop offset="1" stop-color="#B3700C"/></linearGradient>
    <linearGradient id="pb-wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C08850"/><stop offset="1" stop-color="#7B4A22"/></linearGradient>
  </defs>
  <ellipse cx="64" cy="118" rx="44" ry="6" fill="#000" opacity=".35"/>
  <!-- back bling: treasure satchel -->
  <g transform="translate(14 34)">
    <path d="M10 14 Q10 4 20 4 L44 4 Q54 4 54 14 L56 66 Q56 74 48 74 L16 74 Q8 74 8 66 Z" fill="url(#pb-leather)" stroke="#1B1207" stroke-width="4" stroke-linejoin="round"/>
    <path d="M8 26 Q32 36 56 26 L56 40 Q32 50 8 40 Z" fill="#8A5530" stroke="#1B1207" stroke-width="3" stroke-linejoin="round"/>
    <rect x="25" y="30" width="14" height="14" rx="3" fill="url(#pb-gold)" stroke="#1B1207" stroke-width="3"/>
    <circle cx="32" cy="37" r="2.5" fill="#8A5208"/>
    <path d="M18 4 Q18 -8 32 -8 Q46 -8 46 4" fill="none" stroke="#1B1207" stroke-width="7"/>
    <path d="M18 4 Q18 -8 32 -8 Q46 -8 46 4" fill="none" stroke="#9B6A3C" stroke-width="3.5"/>
    <path d="M14 54 h36" stroke="#5C3416" stroke-width="2.5" stroke-dasharray="4 4"/>
  </g>
  <g transform="translate(-6 10)">
  <!-- pickaxe handle -->
  <path d="M40 114 L100 30" stroke="#1B1207" stroke-width="15" stroke-linecap="round"/>
  <path d="M40 114 L100 30" stroke="url(#pb-wood)" stroke-width="9" stroke-linecap="round"/>
  <g stroke="#1B1207" stroke-width="3"><path d="M47 99 l8 6M52 92 l8 6" stroke="#E9C27A" stroke-width="3.5"/></g>
  <!-- pickaxe head -->
  <path d="M60 22 Q90 4 124 30 Q100 22 92 30 Q86 22 70 30 Z" fill="url(#pb-crystal)" stroke="#1B1207" stroke-width="4" stroke-linejoin="round"/>
  <path d="M68 22 Q88 12 108 20" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <rect x="88" y="22" width="20" height="16" rx="4" fill="url(#pb-gold)" stroke="#1B1207" stroke-width="3.5" transform="rotate(34 98 30)"/>
  <circle cx="98" cy="30" r="3" fill="#B57CFF" stroke="#1B1207" stroke-width="1.5"/>
  </g>
  <g fill="#E8D6FF" stroke="#1B1207" stroke-width="1.5" stroke-linejoin="round"><path d="M22 12l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/></g>
